<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">DracoShell — Your terminal. A dragon. A little lightning.</title>
<desc id="desc">Dark cyan and violet banner with a terminal prompt and thin lightning strokes.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070c16"/><stop offset="1" stop-color="#101b2b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#67e8f9" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1280" height="640" rx="28" fill="url(#bg)"/>
<rect width="1280" height="640" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1278" height="638" rx="28" fill="none" stroke="#67e8f9" stroke-opacity=".2"/>
<path d="M72 82H205" stroke="#67e8f9" stroke-width="3"/>
<text x="72" y="124" fill="#8da9bb" font-family="monospace" font-size="17" letter-spacing="3">WINDOWS TERMINAL / POWERSHELL</text>
<text x="67" y="257" fill="#eaf7ff" font-family="sans-serif" font-size="100" font-weight="800" letter-spacing="-4">DracoShell</text>
<text x="73" y="328" fill="#67e8f9" font-family="sans-serif" font-size="32">Your terminal. A dragon. A little lightning.</text>
<text x="73" y="386" fill="#a9bdcf" font-family="sans-serif" font-size="25">Lightning as you type. Fire when you hit Enter.</text>
<rect x="72" y="451" width="724" height="68" rx="12" fill="#050a11" stroke="#284154"/>
<text x="97" y="495" fill="#67e8f9" font-family="monospace" font-size="23">&gt;_</text>
<text x="155" y="495" fill="#d0e0ec" font-family="monospace" font-size="21">github.com/lucatirel/DracoShell</text>
<text x="73" y="572" fill="#7d95a9" font-family="monospace" font-size="16">SUBTLE MOTION · REACTIVE EFFECTS · MIT LICENSE</text>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M1088 77 1035 170 1084 170 1002 287 1048 287 966 417" stroke="#67e8f9" stroke-width="3" opacity=".7"/>
<path d="M1195 198 1147 281 1190 281 1114 405 1156 405 1068 557" stroke="#a78bfa" stroke-width="2" opacity=".65"/>
<path d="M1002 287 939 269 909 313M1114 405 1183 426 1203 471" stroke="#67e8f9" stroke-width="1.5" opacity=".4"/>
</g></svg>
